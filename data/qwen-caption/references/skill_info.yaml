network_arch: qwen-caption
container_image: nvcr.io/nvidian/iva/its-cosmos-sda
gpu_spec_key: null
actions:
  caption:
    command: python -u cosmos_video_generation/caption_utils/vLLM_qwen_video_caption_generation.py
    mode: args
    inputs:
      weak-video-list:
        type: file
      prompt-file:
        type: file
    outputs:
      output-json:
        type: file
    args:
      weak-video-list: '{storage_root}/gaps/gaps.parquet'
      base-url: '{qwen_endpoint}'
      model: Qwen/Qwen3-VL-235B-A22B-Instruct
      prompt-file: '{prompt_file}'
      output-json: '{storage_root}/captions/captions.jsonl'
