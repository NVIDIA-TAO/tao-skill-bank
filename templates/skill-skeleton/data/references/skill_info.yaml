name: REPLACE-WITH-SKILL-NAME
type: data
# container_image: use the stamped-literal + versions-key marker form (below).
# scripts/stamp_versions.py keeps it current on release bumps; CI rejects drift.
# Legacy forms that still parse:
#   - dotted key resolved against ../../../versions.yaml (preferred for shared images)
#   - absolute registry URI (for one-off / experimental / third-party images)
# Examples:
#   container_image: tao_toolkit.pyt
#   container_image: <literal nvcr.io URI stamped from versions.yaml — see the live line below>
container_image: nvcr.io/nvidia/tao/tao-toolkit:7.2.0-pyt  # versions-key: images.tao_toolkit.pyt
required_credentials: []

actions:
  <primary-action>:
    command: python /workspace/scripts/REPLACE.py
    mode: args
    inputs:
      input-dir: { type: folder, required: true }
    outputs:
      output: { type: file }
    upload_excludes:
    - inputs/
    args:
      input-dir: '{input_dir}'
      output: '{output_path}'
    defaults:
      output_path: output.csv

# tags live in SKILL.md frontmatter — not here.
