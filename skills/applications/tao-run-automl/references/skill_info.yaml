name: tao-run-automl
type: workflow
prerequisites:
  required:
  - name: model
    description: A TAO network skill with selected-action defaults and AutoML/HPO notes.
  - name: action_inputs
    description: Dataset, checkpoint, teacher, calibration, or artifact inputs required by the selected action.
  - name: platform
    description: Compute backend exposed by a native TAO platform skill, usually slurm, kubernetes, docker, or brev.
  - name: skill_bank_path
    description: Path to this skill bank so the step engine can load model skills and selected-action specs.
  optional:
  - name: eval_dataset_uri
    description: Validation or evaluation dataset URI when required by the selected model skill.
  - name: algorithm
    description: AutoML search algorithm such as bayesian, hyperband, asha, bohb, llm, hybrid, or autoresearch.
  - name: llm_endpoint
    description: Required for LLM-powered AutoML algorithms; alias base_url is accepted.
  - name: llm_model
    description: Required for LLM-powered AutoML algorithms; alias model is accepted.
  - name: llm_api_key
    description: Environment-only credential for LLM-powered algorithms; read AUTOML_LLM_API_KEY or NVIDIA_API_KEY and never request, print, or persist its value.
actions:
  run:
    description: Run any supported AutoML algorithm/action through the skill-owned step engine and native platform jobs.
  status:
    description: Inspect durable experiment and bound platform job state for progress.
  resume:
    description: Resume or recover an explicitly requested existing AutoML experiment.
depends_on:
  models:
  - <network>
  platform:
  - tao-run-on-brev
  - tao-run-on-slurm
  - tao-run-on-kubernetes
  - tao-run-on-docker
description: TAO AutoML/HPO workflow using skill-owned optimizers and native platform jobs while grounding model- and action-specific details in the selected model skill.
