name: tao-run-deft-icl-aoi-cosmos3
version: 0.2.0
supported_platforms: [docker]
model_skill: tao-finetune-cosmos-reason
backend: cosmos-framework
container_image: tao_toolkit.cosmos_framework
data_format:
  modes: [tht_single, bare_okng]
  training: ShareGPT
  evaluator: external_hash_pinned
companion_skills:
  - tao-in-context-learning
  - tao-generate-anomalies
  - tao-generate-image-embeddings
  - tao-mine-nearest-neighbors
  - tao-run-on-docker
  - tao-launch-workflow
actions:
  simple_harness_preflight:
    mode: args
    args: {}
    command: python scripts/simple_harness.py preflight --config {config} --output {output}
  simple_harness_run:
    mode: args
    args: {}
    command: python scripts/simple_harness.py run --preflight {preflight} --approval {approval} --job-id {job_id}
  simple_harness_status:
    mode: args
    args: {}
    command: python scripts/simple_harness.py status --results-dir {results_dir}
  preflight:
    mode: args
    args: {}
    command: python scripts/suite.py preflight --task {task} --output {output}
  run:
    mode: args
    args: {}
    command: python scripts/suite.py run --preflight {preflight} --approval {approval}
  export:
    mode: args
    args: {}
    command: python scripts/suite.py export --results-dir {results_dir}
  generator_preflight:
    mode: args
    args: {}
    command: python scripts/generator_addendum.py preflight --task {task} --output {output}
  generator_run:
    mode: args
    args: {}
    command: python scripts/generator_addendum.py run --preflight {preflight} --approval {approval}
  generator_export:
    mode: args
    args: {}
    command: python scripts/generator_addendum.py export --results-dir {results_dir}
  icl_preflight:
    mode: args
    args: {}
    command: python scripts/icl_addendum.py preflight --task {task} --output {output}
  icl_run:
    mode: args
    args: {}
    command: python scripts/icl_addendum.py run --preflight {preflight} --approval {approval}
  icl_status:
    mode: args
    args: {}
    command: python scripts/icl_addendum.py status --results-dir {results_dir}
  icl_export:
    mode: args
    args: {}
    command: python scripts/icl_addendum.py export --results-dir {results_dir}
