<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="title description">
  <title id="title">DEFT multi-task mining router</title>
  <desc id="description">Proxy gaps are balanced and collapsed into unique target embeddings. The DEFT router combines them with Mining Pool embeddings and task annotations, applies one of three frozen ablation modes, records provenance, removes historical duplicates, and emits task-aligned training records.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path class="arrow-head" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
    <style>
      .canvas { fill: #ffffff; }
      .title { fill: #000000; font: 700 24px Arial, sans-serif; }
      .subtitle { fill: #444444; font: 400 13px Arial, sans-serif; }
      .node { stroke: #ffffff; stroke-width: 2; filter: url(#shadow); }
      .data { fill: #d96421; }
      .function { fill: #ffbc01; }
      .resource { fill: #8922b9; }
      .nvidia { fill: #76b900; stroke: #333333; }
      .group-box { fill: none; stroke: #999999; stroke-width: 2; }
      .group-label { fill: #333333; font: 600 13px Arial, sans-serif; }
      .text-light { fill: #ffffff; font: 600 14px Arial, sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .text-dark { fill: #000000; font: 600 14px Arial, sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .text-small-light { fill: #ffffff; font: 500 11px Arial, sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .text-small-dark { fill: #000000; font: 500 11px Arial, sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .arrow-line { fill: none; stroke: #666666; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .config-line { fill: none; stroke: #999999; stroke-width: 2.2; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .arrow-head { fill: #666666; }
      .legend { fill: #444444; font: 500 11px Arial, sans-serif; dominant-baseline: middle; }
      @media (prefers-color-scheme: dark) {
        .canvas { fill: #1a1a1a; }
        .title, .group-label { fill: #f4f7f7; }
        .subtitle, .legend { fill: #cccccc; }
        .function { fill: #ffd35c; }
        .data { fill: #e47d44; }
        .resource { fill: #a65bd0; }
        .nvidia { fill: #a0d468; }
        .text-light { fill: #1a1a1a; }
        .text-small-light { fill: #1a1a1a; }
        .arrow-line { stroke: #bbbbbb; }
        .config-line, .group-box { stroke: #777777; }
        .arrow-head { fill: #bbbbbb; }
      }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="1280" height="720"/>
  <text class="title" x="40" y="42">DEFT Multi-Task Mining Router</text>
  <text class="subtitle" x="40" y="68">Same embeddings, explicit routing policy, auditable task provenance</text>

  <!-- Primary input path -->
  <rect class="node data" x="40" y="120" width="180" height="82" rx="4"/>
  <text class="text-light" x="130" y="151">Proxy Gap Records</text>
  <text class="text-small-light" x="130" y="177">task · dataset · weakness</text>

  <rect class="node function" x="270" y="120" width="180" height="82" rx="4"/>
  <text class="text-dark" x="360" y="151">Task-Balanced</text>
  <text class="text-small-dark" x="360" y="177">Gap selection</text>

  <rect class="node function" x="500" y="120" width="180" height="82" rx="4"/>
  <text class="text-dark" x="590" y="151">Collapse by target_id</text>
  <text class="text-small-dark" x="590" y="177">One embedding per image</text>

  <rect class="node data" x="730" y="120" width="190" height="82" rx="4"/>
  <text class="text-light" x="825" y="151">Target Embeddings</text>
  <text class="text-small-light" x="825" y="177">Retain query task types</text>

  <path class="arrow-line" d="M 220 161 L 270 161"/>
  <path class="arrow-line" d="M 450 161 L 500 161"/>
  <path class="arrow-line" d="M 680 161 L 730 161"/>

  <!-- Router inputs -->
  <rect class="node data" x="730" y="245" width="190" height="82" rx="4"/>
  <text class="text-light" x="825" y="276">Mining Pool</text>
  <text class="text-small-light" x="825" y="302">Embeddings + annotated tasks</text>

  <rect class="node resource" x="1020" y="92" width="210" height="72" rx="4"/>
  <text class="text-light" x="1125" y="119">Immutable Run State</text>
  <text class="text-small-light" x="1125" y="143">Frozen router mode</text>

  <polygon class="node nvidia" points="1020,214 1190,214 1230,270 1190,326 1020,326 980,270"/>
  <text class="text-light" x="1105" y="257">NVIDIA DEFT</text>
  <text class="text-light" x="1105" y="280">Mining Router</text>

  <path class="arrow-line" d="M 920 161 Q 960 161 1000 226"/>
  <path class="arrow-line" d="M 920 286 L 980 286"/>
  <path class="config-line" d="M 1125 164 L 1125 214"/>

  <!-- Ablation modes -->
  <rect class="group-box" x="90" y="375" width="890" height="148" rx="8"/>
  <text class="group-label" x="108" y="368">One Ablation Mode</text>

  <rect class="node function" x="125" y="410" width="225" height="78" rx="4"/>
  <text class="text-dark" x="237" y="438">image_only</text>
  <text class="text-small-dark" x="237" y="463">Global cosine top-K</text>

  <rect class="node function" x="420" y="410" width="225" height="78" rx="4"/>
  <text class="text-dark" x="532" y="438">task_strict</text>
  <text class="text-small-dark" x="532" y="463">Top-K per target × task</text>

  <rect class="node function" x="715" y="410" width="230" height="78" rx="4"/>
  <text class="text-dark" x="830" y="438">task_then_fallback</text>
  <text class="text-small-dark" x="830" y="463">Strict first · fill each task</text>

  <path class="arrow-line" d="M 1060 326 Q 930 365 830 410"/>
  <path class="arrow-line" d="M 1060 326 Q 760 352 532 410"/>
  <path class="arrow-line" d="M 1060 326 Q 560 340 237 410"/>

  <!-- Provenance and output -->
  <rect class="node function" x="125" y="575" width="230" height="78" rx="4"/>
  <text class="text-dark" x="240" y="603">Attach Provenance</text>
  <text class="text-small-dark" x="240" y="628">route tier · routed tasks</text>

  <rect class="node function" x="500" y="575" width="230" height="78" rx="4"/>
  <text class="text-dark" x="615" y="603">History-Aware Dedup</text>
  <text class="text-small-dark" x="615" y="628">Novel physical targets only</text>

  <rect class="node data" x="875" y="575" width="250" height="78" rx="4"/>
  <text class="text-light" x="1000" y="603">Task-Aligned Records</text>
  <text class="text-small-light" x="1000" y="628">Auditable training fan-out</text>

  <path class="arrow-line" d="M 237 488 L 237 575"/>
  <path class="arrow-line" d="M 532 488 Q 480 535 355 596"/>
  <path class="arrow-line" d="M 830 488 Q 700 550 355 614"/>
  <path class="arrow-line" d="M 355 614 L 500 614"/>
  <path class="arrow-line" d="M 730 614 L 875 614"/>

  <!-- Compact legend -->
  <rect class="data" x="40" y="685" width="18" height="18" rx="2"/>
  <text class="legend" x="66" y="694">Data</text>
  <rect class="function" x="125" y="685" width="18" height="18" rx="2"/>
  <text class="legend" x="151" y="694">Function</text>
  <rect class="resource" x="235" y="685" width="18" height="18" rx="2"/>
  <text class="legend" x="261" y="694">State resource</text>
  <rect class="nvidia" x="370" y="685" width="18" height="18" rx="2"/>
  <text class="legend" x="396" y="694">NVIDIA component</text>
</svg>
