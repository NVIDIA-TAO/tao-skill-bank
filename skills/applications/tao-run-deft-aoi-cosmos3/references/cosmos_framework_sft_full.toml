# Rendered baseline for 19,968 rows at global batch 512. Use
# scripts/render_cfw_sft.py to seal probe-selected batch and concrete paths.
[job]
task = "vlm"
experiment = "nvpaw_omni_vlm_sft"
project = "deft_aoi"
group = "train"
name = "iterN"
wandb_mode = "disabled"

[model]
attn_implementation = "flash_attention_2"
precision = "bfloat16"

[model.parallelism]
data_parallel_shard_degree = 8
data_parallel_replicate_degree = 1
context_parallel_shard_degree = 1
cfg_parallel_shard_degree = 1

[model.activation_checkpointing]
mode = "full"
save_ops_regex = ["fmha"]
preserve_rng_state = true
determinism_check = "default"

[optimizer]
betas = [0.9, 0.999]
eps = 1e-8
fused = true
keys_to_select = []
lr = 1e-6
weight_decay = 0.05

[scheduler]
cycle_lengths = [195]
f_max = [1.0]
f_min = [0.1]
f_start = [0.05]
warm_up_steps = [5]

[trainer]
distributed_parallelism = "fsdp"
grad_accum_iter = 16
logging_iter = 1
max_iter = 195
num_epochs = 5
steps_per_epoch = 39

[checkpoint]
keys_to_skip_loading = []
load_path = "???"
save_iter = 195
save_freq_in_epoch = 5
dcp_async_mode_enabled = false
