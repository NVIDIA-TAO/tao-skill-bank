#
# `annotations convert` KITTI -> COCO, the settings that do not vary per run.
# image_dir, label_dir, mapping and results_dir are run-specific and stay as --set.

data.input_format: KITTI
data.output_format: COCO

kitti.project: coco            # names the output file: <project>.json. The verify
                               # step and the ODVG conversion both look for
                               # coco.json, so changing this breaks them silently.
