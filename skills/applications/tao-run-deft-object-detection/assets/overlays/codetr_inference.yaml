#
# `codetr inference` — pool pseudo-labelling, the settings that do not vary per
# run, applied over the Hydra schema dump. The checkpoint, classmap, image_dir,
# results_dir, num_gpus and `inference.category_mapping` are run-specific and stay
# as --set; the mapping is emitted by prepare_class_mappings_for_mining_data_prep.py.

inference.conf_threshold: 0.3  # TAO: 0.5. Applied at write time, so it is the
                               # quality control on the pseudo-labels — every box
                               # above it becomes training data.

inference.input_width: 640     # TAO: null, which defers sizing to the
inference.input_height: 640    # augmentation path: roughly 4x slower and a
                               # different set of boxes, neither of them reported.

model.soft_nms_enabled: true   # TAO: false. `inference.category_mapping` folds classes and
                               # then runs per-output-category soft-NMS, but only when this is
                               # on. With it off the fold renames without merging, so one
                               # object detected as both car and truck yields two boxes of the
                               # same class in the pool: 277 boxes off vs 151 on, over 8 images
                               # at conf 0.05. Those duplicates become training data.
model.soft_nms_iou_threshold: 0.8

# --- Architecture. Must match the checkpoint; a mismatch fails silently. -------
# These describe the ViT-Large COCO-80 detector this workflow pseudo-labels with
# (zongzhuofan/co-detr-vit-large-coco). They are pinned here rather than left to
# the schema because every one of TAO's defaults is wrong for that checkpoint, and
# the resulting run still prints `Execution status: PASS` and exits 0 — it writes
# one label file per image with zero boxes, because the weights could not load into
# the layers and the detector is effectively randomly initialised. The only signal
# is a `Skipping size-mismatched key` line buried in the load log.
#
# A different checkpoint needs different values here, so overriding these with
# --set requires --allow-workflow-default-override. Derive them from the checkpoint
# rather than guessing: `patch_embed.proj.weight` of shape [D, 3, P, P] gives the
# embed dim D and patch size P (1024/16 here, hence vit_large_codetr, which is
# ViT-L/16 — the patch-14 DINOv2 backbone cannot load into it), and the
# `query_embed` first dimension gives num_queries.
model.backbone: vit_large_codetr   # TAO: swin_large_patch4_window7_224
model.num_queries: 1500            # TAO: 900
model.num_feature_levels: 5        # TAO: 4
dataset.num_classes: 80            # TAO: 91. COCO-80, not COCO-91.
