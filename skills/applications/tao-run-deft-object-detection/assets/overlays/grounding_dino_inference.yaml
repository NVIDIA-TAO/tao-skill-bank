#
# `grounding_dino inference` — the settings that do not vary per run.
# Applied over the Hydra schema dump. The checkpoint, results_dir, num_gpus,
# image_dir, captions and max_labels vary per phase and stay as --set.
#
# `captions` is deliberately NOT here: it is the label map (a detection takes the
# class of the caption token it matched, by position), so it must be derived from
# the run's classes rather than pinned. See references/grounding-dino.md.

inference.conf_threshold: 0.0  # Keep the full PR curve — gap_analysis and KPI both
                               # score these labels, and inference drops anything
                               # below this at write time, so a non-zero value here
                               # silently truncates what every later stage can see.

dataset.batch_size: 8

# The model block must match the checkpoint. Both of the next two fail silently
# rather than loudly when wrong, which is why they are pinned rather than left to
# the schema: see references/grounding-dino.md.
model.log_scale: auto          # never null
model.class_embed_bias: true   # must match the checkpoint

model.backbone: swin_tiny_224_1k
model.num_feature_levels: 4
model.dec_layers: 6
model.enc_layers: 6
model.num_queries: 900
model.dropout_ratio: 0.0
model.dim_feedforward: 2048
