#
# `analytics kpi_analyze` — the settings that do not vary per run.
# Applied over the spec `analytics default_specs` emits. Paths, `visualize.tag`
# and `data.kpi_sources` vary per phase and stay as --set.
#
# Every value here differs from, or is silently inherited from, a TAO default.
# The comparison as of tao-toolkit-ds:7.0.1:

data.input_format: KITTI       # TAO: KITTI. Uppercase here, lowercase in
                               # `gap_analysis object_detection` in the same image.
visualize.platform: local      # TAO: local. Pinned so a loop stage can never
                               # acquire a wandb credential dependency.

kpi.iou_threshold: 0.5         # TAO: 0.5
kpi.num_recall_points: 11      # TAO: 11 — but a run that sets 101 switches from
                               # VOC-style 11-point interpolated AP to COCO-style
                               # 101-point, moving every AP in the report.
kpi.ignore_sqwidth: 40         # TAO: 0 — this is the field that drifted. Omitting
                               # it scores small boxes the reference excludes, so
                               # the numbers describe a different box set.
kpi.filter: false              # TAO: false
kpi.is_internal: false         # TAO: false. True drops every class except person
                               # and appends a Summary row, changing what the
                               # report means while still exiting 0.

# UNRESOLVED — this value is contested, see references/tao-analyze-detection-kpi.md.
# That doc specifies 0.3. references/grounding-dino.md says a downstream threshold
# *composes* with the one inference already applied at write time, and to keep them
# consistent — and inference and gap_analysis are both 0.0. The completed 5k/100k
# runs used 0.0. Left at the documented 0.3 rather than resolved silently; changing
# it is this one line.
kpi.conf_threshold: 0.3
