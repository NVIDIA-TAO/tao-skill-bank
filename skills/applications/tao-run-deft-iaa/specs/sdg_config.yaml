    backend: "vllm"
    port: 8001
    min_vram_mib: 28000

endpoints:
  ownership: managed
  # Materialization sets this true only for an explicitly user-requested
  # external-endpoint reuse path.
  reuse_requested: false
  # Materialization binds this to the approved credential-forwarding choice.
  forward_hf_token: false
  startup_timeout_s: 1800
  request_timeout_s: 180
  retry_interval_s: 15
  cache_dir: ""
  # Materialized run configuration must replace every list with explicit IDs.
  gpu_ids:
    image_edit: []
    vlm: []
    llm: []
  external_urls:
    image_edit: ""
    vlm: ""
    llm: ""

generation:
  # Distributed platforms materialize N independent 8-GPU worker machines.
  # Docker and virtualenv keep generation_nodes=1 and set this GPU count from
  # the explicitly selected local image-edit devices.
  generation_nodes: 1
  gpus_per_generation_node: 1
  image_edit_request_timeout_s: 600
  scale_factor: 1.0
  max_samples_per_iteration: 1000
  augmentations_per_source: 1
  verification_max_attempts: 2
  caption_policy: all
  query_levels: [easy, medium, hard]
  queries_per_level: 3
