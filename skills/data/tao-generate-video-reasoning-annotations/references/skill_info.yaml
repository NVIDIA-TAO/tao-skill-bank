network_arch: tao-generate-video-reasoning-annotations
type: data
container_image: nvcr.io/nvidia/tao/tao-toolkit:7.2.0-data-services  # versions-key: images.tao_toolkit.data_services
gpu_spec_key: null
required_credentials: []
actions:
  generate:
    # {config_path} is a copy of a bundled experiment_specs/video_reasoning_annotation_*.yaml
    # with endpoints (vlm/llm/models) edited in the file: the bundled specs share endpoint
    # blocks via YAML anchors, so CLI overrides of vlm.*/llm.* do not reach models.*.
    # Only per-run fields are args. Domain fields (prompts_module, qa_types, mode, fp_guards,
    # license, description_extra) live in the spec: a CLI default would replace the spec's
    # value (e.g. public_safety's prompts and QA families).
    command: auto_label generate -e {config_path}
    config_format: yaml
    mode: args
    inputs:
      video-root:
        type: folder
      input-jsonl-files:
        type: file
    outputs:
      results-dir:
        type: folder
    upload_excludes:
    - inputs/
    args:
      results_dir: '{results_dir}'
      video_reasoning_annotation.data.video_root: '{video_root}'
      video_reasoning_annotation.data.input_jsonl_files: '{input_jsonl_files}'
      video_reasoning_annotation.workflow.steps: '{steps}'
      video_reasoning_annotation.workflow.qa_resume: '{qa_resume}'
    defaults:
      steps: '["0a","0b","0c","0d","0e","0f","1a","1b","1c","2a","3","4a","4b","5"]'
      qa_resume: 'false'
