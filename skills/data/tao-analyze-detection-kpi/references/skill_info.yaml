network_arch: tao-analyze-detection-kpi
type: data
container_image: nvcr.io/nvstaging/tao/tao-toolkit-ds:7.0.1-rc-200-x86  # unpinned: held at the build this skill is validated against; repin once 7.1.0-data-services is confirmed to carry the action
gpu_spec_key: null
required_credentials: []
actions:
  kpi_analyze:
    command: analytics kpi_analyze -e {config_path}
    config_format: yaml
    mode: config
    inputs:
      ground_truth_ann_path:
        type: file
      inference_ann_path:
        type: file
      mapping:
        type: file
    outputs:
      results_dir:
        type: directory
    upload_excludes:
    - inputs/
