network_arch: tao-analyze-gaps-vlm-bcq
type: data
container_image: nvcr.io/nvstaging/tao/tao-toolkit-ds:7.2.0-rc-46-multiarch  # versions-key: images.tao_toolkit.data_services
gpu_spec_key: null
required_credentials: []
actions:
  vlm_bcq:
    command: gap_analysis vlm_bcq -e {config_path}
    config_format: yaml
    mode: config
    inputs:
      predictions_json:
        type: file
      videos_dir:
        type: folder
        optional: true
    outputs:
      results_dir:
        type: folder
    upload_excludes:
    - inputs/
    defaults:
      videos_dir: ''
