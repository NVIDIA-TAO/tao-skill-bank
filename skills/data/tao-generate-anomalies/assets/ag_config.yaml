# AnomalyGen 1.2 training recipe template. Set dataset paths and class pairs before use.
task_type: texture_ft
experiment: anomalygen_texture_ft
model_size: nano
per_class_lora_rank: 8
per_class_lora_alpha: 8
max_iter: 5000
validation_iter: 1000
run_validation_on_start: true
save_iter: 1000
cycle_lengths: 5000
warm_up_steps: 500
logging_iter: 10
seed: 42
lr: 0.001
betas:
- 0.9
- 0.95
eps: 1.0e-06
weight_decay: 0.0
batch_size: 4
num_workers: 4
shift: 1.0
validation_batch_size: 16
early_stop_enabled: false
early_stop_metric: nn
early_stop_patience: 5
early_stop_min_delta: 0.0
early_stop_min_delta_mode: rel
crop_mode: scale
input_size_ladder:
- 256
- 512
- 1024
- 1536
crop_ratio_range:
- 1.5
- 2.5
scale_range:
- 0.3333333333333333
- 3.0
inference_scale: 1.0
