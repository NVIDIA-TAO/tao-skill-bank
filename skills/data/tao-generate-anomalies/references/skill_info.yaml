      expected_dataset_inventory: --expected-dataset-inventory {expected_dataset_inventory}
      checkpoint_root: --checkpoint-root {checkpoint_root}
      num_gpus: --num-gpus {num_gpus}
      num_sdg: --num-sdg {num_sdg}
      num_search_run: --num-search-run {num_search_run}
      score: --score {score}
      base_seed: --base-seed {base_seed}
      mask_backend: --mask-backend {mask_backend}
      checkpoint_file: --checkpoint {checkpoint_file}
      amg_model_registry: --amg-model-registry {amg_model_registry}
      amp_seed: --amp-seed {amp_seed}
      amg_gen_model: --amg-gen-model {amg_gen_model}
      amg_judge_model: --amg-judge-model {amg_judge_model}
      per_defect_counts: --per-defect-counts {per_defect_counts}
      min_nn_improvement: --min-nn-improvement {min_nn_improvement}
      parallelism: --parallelism {parallelism}
      compile: --compile {compile}
      # Optional flag tokens: empty omits the argument; never append a boolean value.
      # Set pseudo_label_flag to --pseudo-label or skip_quality_flag to --skip-quality.
