      num_search_run: 3
      score: nn
      base_seed: 1
      mask_backend: amp
      amp_seed: 43
      min_nn_improvement: 0.0
      parallelism: ddp
      compile: 'true'
      pseudo_label_flag: ''
      skip_quality_flag: ''
    upload_excludes:
    - dataset-view/
