network_arch: cosmos-predict-2-5
container_image: nvcr.io/nvidian/iva/sda-cosmos-predict-2
gpu_spec_key: null
required_credentials:
- HF_TOKEN
actions:
  generate:
    command: python run_text2world_batch.py
    mode: args
    num_gpus: '{num_gpus}'
    inputs:
      input-json:
        type: file
      weak-data-list:
        type: file
    outputs:
      output-dir:
        type: folder
    args:
      input-json: '{storage_root}/splits/captions_split_{split_id}.jsonl'
      weak-data-list: '{storage_root}/splits/weak_data_split_{split_id}.parquet'
      output-dir: '{storage_root}/generated/split_{split_id}'
      num-gpus: '{num_gpus}'
      num-output-frames: 500
      guidance: 7
    flags:
    - disable-guardrails
    defaults:
      num_gpus: 8
