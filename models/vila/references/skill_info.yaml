name: vila
network_arch: vila
container_image: tao_toolkit.vila
data_format: default
gpu_spec_key: train.num_gpus
actions:
  train:
    command: vila train -e {config_path}
    config_format: yaml
    inputs:
      train.dataset.dataset_yaml_path:
        type: file
    outputs:
      results_dir:
        type: folder
    upload_excludes:
    - inputs/
  evaluate:
    command: vila evaluate -e {config_path}
    config_format: yaml
    inputs: {}
    outputs:
      results_dir:
        type: folder
    upload_excludes:
    - inputs/
  inference:
    command: vila inference -e {config_path}
    config_format: yaml
    inputs: {}
    outputs:
      results_dir:
        type: folder
    upload_excludes:
    - inputs/
data_sources: {}
spec_params: {}
key_defaults: {}
spec_shorthand_keys:
  num_epochs: train.num_epochs
  batch_size: dataset.batch_size
  learning_rate: train.optim.lr
description: VILA vision-language model for multimodal understanding tasks. Supports video and image-based question answering,
  captioning, and reasoning. Fine-tunable with LoRA or full fine-tuning on custom VLM datasets.
