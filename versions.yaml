# versions.yaml — single source of truth for TAO container images and SDK wheels.
#
# Skills reference these by dotted key in their `references/skill_info.yaml`
# `container_image` field. CI bumps RC versions by editing this file; downstream
# skills resolve their image at runtime via `tao_sdk.versions.resolve_image()`.
#
# Both forms are valid in skill_info.yaml:
#   container_image: tao_toolkit.pyt                                 # key reference (preferred)
#   container_image: nvcr.io/nvidia/tao/tao-toolkit:6.26.3-pyt       # absolute path (also valid)
#
# Use absolute paths for experimental images, third-party registries, or one-off
# skills not worth adding here. Add to this file when the image will be used by
# more than one skill OR will be bumped on a release cadence.

images:
  tao_toolkit:
    pyt:                nvcr.io/nvstaging/tao/tao-toolkit-pyt:6.26.6-rc-223-multiarch
    deploy:             nvcr.io/nvstaging/tao/tao-toolkit-deploy:6.26.6-rc-162-multiarch
    data_services:      nvcr.io/nvstaging/tao/tao-toolkit-ds:6.26.6-rc-175-multiarch
    cosmos_rl:          nvcr.io/nvstaging/tao/cosmos_rl:6.26.6-rc-164-multiarch
    cosmos_predict_2_5: nvcr.io/nvstaging/tao/cosmos-predict:6.26.6-rc-51
    cosmos_embed:       nvcr.io/nvstaging/tao/cosmos-embed:6.26.6-rc-42
    vila:               nvcr.io/nvidia/tao/tao-toolkit:6.26.3-vila

  metropolis_sdg:
    cosmos_anomalygen: nvcr.io/nv-metropolis-dev/metropolis-sdg/cosmos-anomalygen:1.0.3-006434bb.main

wheels:
  # Single SDK wheel with extras. The `nvidia-tao-sdk` package consolidates
  # what used to be three wheels (tao-sdk, tao-sdk-lepton, tao-sdk-brev).
  tao_sdk:        nvidia-tao-sdk==6.26.6rc16
  tao_sdk_lepton: nvidia-tao-sdk[lepton]==6.26.6rc16
  tao_sdk_brev:   nvidia-tao-sdk[brev]==6.26.6rc16
  tao_sdk_all:    nvidia-tao-sdk[all]==6.26.6rc16
