# versions.yaml — build-time source of truth for TAO container images and Python wheels.
#
# Skills are standalone: they carry literal image URIs and wheel pins, each
# annotated with the key it came from ("# versions-key: images.tao_toolkit.pyt").
# scripts/stamp_versions.py fans this file out to every annotated line on a
# release bump, and `stamp_versions.py --check` (run in CI) fails if any
# annotated line drifts from this file. Do not hand-edit stamped values in
# skills — edit here and run the stamper.
#
# Legacy key references (container_image: tao_toolkit.pyt) are still resolved
# by the validator and the SDK, but new skills should carry the stamped
# literal + marker form:
#   container_image: nvcr.io/nvidia/tao/tao-toolkit:7.0.1-pyt  # versions-key: images.tao_toolkit.pyt
#
# Use unannotated absolute paths only for experimental images, third-party
# registries, or one-offs (annotate those "# unpinned: <reason>"). Add a key
# here when the image is used by more than one skill OR is bumped on a
# release cadence.
#
# Registry-org policy: nvcr.io/nvstaging/* pins are RC-only — the public
# nvcr.io/nvidia/tao org carries no 7.1.x tags until GA. At GA, flip the
# nvstaging entries below to the released nvcr.io/nvidia/tao URIs and run
# scripts/stamp_versions.py: every stamped site (model skill_info.yaml files
# and platform-skill examples alike) picks up the public image in one pass.
# Do not hand-swap orgs inside skill files — CI rejects stamps that do not
# match this file. Skill prose must stay org-agnostic ("the org of the pinned
# image") so only stamped pins ever name an org and the GA de-RC sweep is
# exactly this file + one stamper run.

images:
  tao_toolkit:
    pyt:                nvcr.io/nvidia/tao/tao-toolkit:7.1.0-pyt
    deploy:             nvcr.io/nvidia/tao/tao-toolkit:7.1.0-deploy
    data_services:      nvcr.io/nvidia/tao/tao-toolkit:7.1.0-data-services
    data_services_nightly: nvcr.io/nvstaging/tao/tao-toolkit-ds:2026.8.10-rc-26-multiarch
    # Interim until `gap_analysis object_detection` and `tmm unique_neighbor_matching` ship
    # in a release data-services image. Verified to carry all five actions the DEFT
    # object-detection pipeline uses: gap_analysis, tmm, analytics, embedding, annotations.
    data_services_od:   nvcr.io/nvstaging/tao/tao-dataservices:gapanalysis-02
    # TAO 7.1.0 has the Cosmos Reason Conv3d/vLLM import regression (NVBUG 6587006).
    cosmos_rl:          nvcr.io/nvstaging/tao/cosmos-rl:enhanced-hooks-custom-loggers-20260816-nvdec-capability-v1
    deft_cosmos_reason: nvcr.io/nvidia/tao/tao-toolkit:7.0.1-cosmos-rl
    cosmos_predict:     nvcr.io/nvidia/tao/tao-toolkit:7.0.1-cosmos-predict
    cosmos_embed:       nvcr.io/nvidia/tao/tao-toolkit:7.1.0-cosmos-embed
    # Interim until tao-pytorch !620 merges and TAO publishes an official IV2CLIP image.
    video_clip:         nvcr.io/nvstaging/tao/tao-toolkit-pyt:v7.0.1-pyt2.1.0-py3-03
    vila:               nvcr.io/nvidia/tao/tao-toolkit:6.26.3-vila

  metropolis_sdg:
    paidf_anomalygen: nvcr.io/nvidia/paidf-anomalygen:1.0.1
    paidf_augmentation: nvcr.io/nvidia/paidf-augmentation:1.0.0
wheels:
  # TAO Python wheels, published to public PyPI. Skill Preflight sections
  # resolve these keys via `scripts/resolve_versions_key.py wheels.<key>` —
  # exactly like the image keys above — so the pin lives in one place.
  #
  # RC / version bump: change the version on the relevant entries (e.g.
  # `==7.0.0` -> `==7.1.0rc1`). To pull an internal pre-release, publish the RC
  # to the index pip is pointed at and pin the exact RC version here; pip
  # installs an exact pre-release pin without needing `--pre`.
  #
  # The `nvidia-tao-sdk` package consolidates what used to be multiple wheels
  # (tao-sdk, tao-sdk-brev). One entry per platform extra.
  #
  # RETAINED ONLY AS THE TRANSITIVE DEPENDENCY OF nvidia-tao-automl (AutoML).
  # The skill bank no longer uses the TAO SDK execution abstraction directly:
  # platform skills run containers via docker/kubectl/srun and the SDK-free
  # 4-verb consumer path (tao-data-io + tao_job_record + tao-launch-workflow).
  # These `tao_sdk_*` keys exist so nvidia-tao-automl can pull a matching SDK.
  tao_sdk:            nvidia-tao-sdk==7.1.0
  tao_sdk_brev:       nvidia-tao-sdk[brev]==7.1.0
  tao_sdk_slurm:      nvidia-tao-sdk[slurm]==7.1.0
  tao_sdk_kubernetes: nvidia-tao-sdk[kubernetes]==7.1.0
  tao_sdk_docker:     nvidia-tao-sdk[docker]==7.1.0
  tao_sdk_all:        nvidia-tao-sdk[all]==7.1.0
  # nvidia-tao-automl pulls nvidia-tao-sdk as a transitive dep. One entry per
  # platform extra; append `,llm` or `,wandb` to an extra at install time for
  # the agentic-search or experiment-tracking deps.
  tao_automl_slurm:      nvidia-tao-automl[slurm]==7.1.0
  tao_automl_kubernetes: nvidia-tao-automl[kubernetes]==7.1.0
  tao_automl_docker:     nvidia-tao-automl[docker]==7.1.0
  tao_automl_brev:       nvidia-tao-automl[brev]==7.1.0
  tao_automl_all:        nvidia-tao-automl[all]==7.1.0
