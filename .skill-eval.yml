# NV-ACES Skill Evaluation Configuration
# Reference: https://gitlab-master.nvidia.com/astra/skill-eval-ci

# Directories containing skills.
skills_dirs:
  - "applications/"
  - "data/"
  - "models/"
  - "platform/"

# Minimum Tier 1 quality score to pass (0-100).
min_score: 70

# Block pipeline on security findings at this severity or above (low, medium, high, critical).
security_fail_on: high

# When true, evaluation failures are red and block the pipeline.
# When false (default), failures show as orange warnings but don't block.
gating_enabled: false

# --- Optional settings (uncomment to customize) ---

# Enable Tier 2 LLM-as-Judge evaluation (requires NVIDIA_INFERENCE_KEY CI variable).
# This needs an sk-* key from: https://inference.nvidia.com/key-management
# tier2_enabled: false

# Tier 2 judge model (default: Claude 3.7 Sonnet). Override for cost or quality.
# Examples: aws/anthropic/bedrock-claude-3-5-haiku-v1, nvidia/nvidia/nemotron-nano-9b-v2
# tier2_judge_model: aws/anthropic/bedrock-claude-3-7-sonnet-v1

# Docker image for NV-ACES jobs (override only if needed).
# python_image: python:3.12
