name: nvidia-gpu-setup
type: platform
actions:
  check_docker:
    command: bash platform/nvidia-gpu-setup/scripts/setup-nvidia-gpu-host.sh --backend docker --check-only
    outputs:
      runtime_status: {type: text}
  install_docker:
    command: bash platform/nvidia-gpu-setup/scripts/setup-nvidia-gpu-host.sh --backend docker --install --yes
    outputs:
      runtime_status: {type: text}
  check_kubernetes:
    command: bash platform/nvidia-gpu-setup/scripts/setup-nvidia-gpu-host.sh --backend kubernetes --check-only
    outputs:
      runtime_status: {type: text}
  install_kubernetes:
    command: bash platform/nvidia-gpu-setup/scripts/setup-nvidia-gpu-host.sh --backend kubernetes --install --yes
    outputs:
      runtime_status: {type: text}
